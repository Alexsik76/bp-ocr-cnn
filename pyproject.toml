[project]
name = "bpocr"
version = "0.1.0"
description = "Blood pressure monitor display OCR: YOLO display detector + digit detector"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=2.0",
    "ultralytics>=8.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "torch",
    "torchvision",
]

[project.scripts]
bpocr = "bpocr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bpocr"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "runs",
    "latest_models",
    "cropped",
    "img_test",
    "labels",
    "work",
    "skills",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
